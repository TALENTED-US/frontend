<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="/icons/icon-192.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0a1680">
    <meta name="application-name" content="버티">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="버티">
    <meta name="description" content="취업 준비 기간의 자산을 분석하고 미래를 계획하는 금융생활 지원 서비스">
    <script>
      if (
        (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true) &&
        window.innerWidth <= 1024
      ) {
        document.documentElement.classList.add('pwa-standalone')
      }
    </script>
    <style>
      #pwa-splash {
        display: none;
      }

      .pwa-standalone #pwa-splash {
        position: fixed;
        inset: 0;
        display: flex;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        min-height: -webkit-fill-available;
        overflow: hidden;
        background: #fbedb0;
      }

      .pwa-standalone #pwa-splash img {
        width: 100vw;
        height: 100%;
        max-width: none;
        object-fit: fill;
      }
    </style>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
    <title>버티 | 취업 준비 금융생활 지원</title>
  </head>
  <body>
    <div id="app">
      <div id="pwa-splash" role="status" aria-label="버티 앱을 여는 중">
        <img src="/screenshots/start-screen.png" alt="">
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
